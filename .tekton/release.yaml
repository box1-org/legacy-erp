# Release on push to main: run the shared legacy-erp-appliance Pipeline
# (.tekton/appliance-pipeline.yaml) with this commit and box1-ops-erp-simulator
# main. box1-ops-erp-simulator pushes run the same Pipeline with the roles
# swapped. See the pipeline file for its stages; the release ends with the image
# applied in the running VM (`bootc upgrade --apply`) and verified.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  labels:
    backstage.io/kubernetes-id: legacy-erp
  generateName: "legacy-erp-release-"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: '10'
spec:
  pipelineRef:
    name: legacy-erp-appliance
  taskRunTemplate:
    serviceAccountName: ci-bootc-release
  timeouts:
    pipeline: 120m
  params:
  - name: os-revision
    value: "{{revision}}"
  - name: erp-revision
    value: main
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  - name: security-gates
    value: observe
  pipelineSpec:
    params:
    - name: revision
      type: string
    - name: git-auth-secret
      type: string
    - name: security-gates
      type: string
      default: observe
    tasks:
    - name: build
      retries: 1   # PAC can briefly create the run before its git auth Secret.
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-bootc-build
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: source-repo
        value: box1-org/legacy-erp
      - name: image-name
        value: "legacy-erp"
      - name: push-image
        value: 'true'
    - name: security
      runAfter:
      - build
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-security-gates
        - name: namespace
          value: box1-ci
      params:
      - name: image-reference
        value: "image-registry.openshift-image-registry.svc:5000/box1-ci/legacy-erp@$(tasks.build.results.image-digest)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: source-revision
        value: "$(params.revision)"
      - name: source-repository
        value: "box1-org/legacy-erp"
      - name: application-name
        value: "legacy-erp"
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: enforcement
        value: "$(params.security-gates)"
      - name: rhtpa-secret
        value: rhtpa-ci
      - name: rhacs-secret
        value: rhacs-ci
    - name: disk
      runAfter:
      - security
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-bootc-disk
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-name
        value: "legacy-erp"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: channel
        value: development
    - name: promote
      runAfter:
      - disk
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-gitops-promote
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: environment
        value: development
      - name: pipeline-run
        value: "$(context.pipelineRun.name)"
      - name: application-name
        value: "legacy-erp"
      - name: workload-profile
        value: virtual-machine
      - name: disk-digest
        value: "$(tasks.disk.results.disk-digest)"
    - name: channel
      runAfter:
      - promote
      when:
      - input: "$(tasks.promote.results.promoted)"
        operator: in
        values:
        - 'true'
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-bootc-channel
        - name: namespace
          value: box1-ci
      params:
      - name: image-name
        value: "legacy-erp"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: channel
        value: development
    - name: smoke
      runAfter:
      - channel
      when:
      - input: "$(tasks.promote.results.promoted)"
        operator: in
        values:
        - 'true'
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-vm-smoke
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: image-digest
        value: "$(tasks.build.results.image-digest)"
      - name: application-name
        value: "legacy-erp"
      - name: application-namespace
        value: "legacy-erp-dev"
    results:
    - name: image-digest
      value: "$(tasks.build.results.image-digest)"
    - name: disk-digest
      value: "$(tasks.disk.results.disk-digest)"
    - name: gitops-pr
      value: "$(tasks.promote.results.pr-url)"
    - name: gitops-revision
      value: "$(tasks.promote.results.gitops-revision)"
    - name: rhacs-url
      value: "$(tasks.security.results.rhacs-url)"
    - name: rhtpa-sbom-url
      value: "$(tasks.security.results.rhtpa-sbom-url)"
    # Read by the OpenShift Pipelines console Vulnerabilities column. Emitted
    # only when box1-security-gates produced a scan summary; otherwise "-".
    - name: SCAN_OUTPUT
      value: "$(tasks.security.results.SCAN_OUTPUT)"
  taskRunSpecs:
  - pipelineTaskName: resolve
    serviceAccountName: ci-test
  - pipelineTaskName: erp-test
    serviceAccountName: ci-test
  - pipelineTaskName: current
    serviceAccountName: ci-test
  - pipelineTaskName: security
    serviceAccountName: ci-build
  - pipelineTaskName: promote
    serviceAccountName: ci-gitops
  - pipelineTaskName: deploy
    serviceAccountName: ci-vm-deploy
  - pipelineTaskName: smoke
    serviceAccountName: ci-observe
