# Release on push to main: run the shared legacy-erp-appliance Pipeline
# (.tekton/appliance-pipeline.yaml) with this commit and box1-ops-erp-simulator
# main. box1-ops-erp-simulator pushes run the same Pipeline with the roles
# swapped. See the pipeline file for its stages; the release ends with the image
# applied in the running VM (`bootc upgrade --apply`) and verified.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  labels:
    backstage.io/kubernetes-id: legacy-erp
  generateName: "legacy-erp-release-"
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: '10'
spec:
  pipelineRef:
    name: legacy-erp-appliance
  taskRunTemplate:
    serviceAccountName: ci-bootc-release
  timeouts:
    pipeline: 120m
  params:
  - name: os-revision
    value: "{{revision}}"
  - name: erp-revision
    value: main
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  - name: security-gates
    value: observe
  taskRunSpecs:
  - pipelineTaskName: resolve
    serviceAccountName: ci-test
  - pipelineTaskName: erp-test
    serviceAccountName: ci-test
  - pipelineTaskName: current
    serviceAccountName: ci-test
  - pipelineTaskName: security
    serviceAccountName: ci-build
  - pipelineTaskName: promote
    serviceAccountName: ci-gitops
  - pipelineTaskName: deploy
    serviceAccountName: ci-vm-deploy
  - pipelineTaskName: smoke
    serviceAccountName: ci-observe
