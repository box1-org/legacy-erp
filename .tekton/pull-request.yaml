# PR check: build the OS image (bootc container lint runs inside the Containerfile)
# without pushing, with box1-ops-erp-simulator main as erp-src/. ci-bootc-check can
# run privileged pods but has no API token and no registry rights.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: legacy-erp-validate-
  labels:
    backstage.io/kubernetes-id: legacy-erp
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: ci-bootc-check
  timeouts:
    pipeline: 30m
  params:
  - name: revision
    value: "{{revision}}"
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  pipelineSpec:
    params:
    - name: revision
      type: string
    - name: git-auth-secret
      type: string
    tasks:
    - name: resolve
      retries: 1   # PAC can briefly create the run before its git auth Secret.
      params:
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      taskSpec:
        params:
        - name: git-auth-secret
        results:
        - name: erp-revision
        steps:
        - name: resolve
          image: registry.access.redhat.com/ubi10/python-312-minimal@sha256:7a3ccd58d8a660d782e8705585aaea2ffe2f2a5d3285507a265dae7d0302b233
          env:
          - name: GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: "$(params.git-auth-secret)"
                key: git-provider-token
          script: |
            #!/usr/bin/env python3
            import json, os, re, urllib.request
            req=urllib.request.Request('https://api.github.com/repos/box1-org/box1-ops-erp-simulator/commits/main',
                headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(req,timeout=30) as r: sha=json.load(r)['sha']
            assert re.fullmatch('[a-f0-9]{40}',sha)
            open('$(results.erp-revision.path)','w').write(sha)
            print('box1-org/box1-ops-erp-simulator main '+sha)
    - name: validate
      runAfter: [resolve]
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-bootc-build
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: source-repo
        value: box1-org/legacy-erp
      - name: image-name
        value: "legacy-erp"
      - name: push-image
        value: 'false'
      - name: extra-source-repo
        value: box1-org/box1-ops-erp-simulator
      - name: extra-source-revision
        value: "$(tasks.resolve.results.erp-revision)"
      - name: extra-source-path
        value: erp-src
