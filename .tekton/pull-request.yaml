# PR check: build the OS image (bootc container lint runs inside the Containerfile)
# without pushing. ci-bootc-check can run privileged pods but has no API token and
# no registry rights.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: legacy-erp-validate-
  labels:
    backstage.io/kubernetes-id: legacy-erp
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: ci-bootc-check
  timeouts:
    pipeline: 30m
  params:
  - name: revision
    value: "{{revision}}"
  - name: git-auth-secret
    value: "{{git_auth_secret}}"
  pipelineSpec:
    params:
    - name: revision
      type: string
    - name: git-auth-secret
      type: string
    tasks:
    - name: validate
      retries: 1   # PAC can briefly create the run before its git auth Secret.
      taskRef:
        resolver: cluster
        params:
        - name: kind
          value: task
        - name: name
          value: box1-bootc-build
        - name: namespace
          value: box1-ci
      params:
      - name: revision
        value: "$(params.revision)"
      - name: git-auth-secret
        value: "$(params.git-auth-secret)"
      - name: source-repo
        value: box1-org/legacy-erp
      - name: image-name
        value: "legacy-erp"
      - name: push-image
        value: 'false'
