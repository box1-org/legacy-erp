# Appliance wiring (box1-docs#25). The unit's own RequiresMountsFor=/srv/box1-erp
# names a symlinked path that has no mount unit; this drop-in names the real one
# and orders the unit after the volume layout exists.
[Unit]
RequiresMountsFor=/var/srv/box1-erp
Requires=box1-erp-data-provision.service
After=box1-erp-data-provision.service
